name: Check SQLite FTS5 Availability

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  check-fts5:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify SQLite FTS5 extension availability
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect(':memory:')
          conn.execute('CREATE VIRTUAL TABLE test_fts USING fts5(filepath, content);')
          conn.execute('INSERT INTO test_fts VALUES (?, ?);', ('test.py', 'def sherlock(): pass'))
          cur = conn.execute('SELECT filepath, bm25(test_fts) FROM test_fts WHERE test_fts MATCH ?;', ('sherlock',))
          row = cur.fetchone()
          assert row is not None and row[0] == 'test.py', 'FTS5 verification failed'
          print(f'SQLite version {sqlite3.sqlite_version} with FTS5: OK')
          "
